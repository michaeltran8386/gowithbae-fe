# Thay cho proxy của Vite dev server: phục vụ bản build và chuyển /api sang container backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Tên host "backend" phân giải trong network Docker. Chạy bằng `docker run` thì đặt
    # --network-alias backend cho container API (hoặc đặt tên service là backend trong compose).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;   # upload ảnh tối đa 5 MB (application-uploads.yml)
    }

    # File có hash trong tên (assets/*) cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn khác trả index.html để React Router xử lý (F5 ở /places/... không bị 404)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
